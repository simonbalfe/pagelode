services:
  pagelode:
    build: .
    environment:
      PORT: 8083
      PAGELODE_BROWSER_URL: http://browser:8090
      PAGELODE_BROWSER_TOKEN: ${BROWSER_SERVICE_TOKEN:?set BROWSER_SERVICE_TOKEN}
      PAGELODE_PROXY_URL: ${PAGELODE_PROXY_URL:-}
      PAGELODE_PROTECTED_DOMAINS: ${PAGELODE_PROTECTED_DOMAINS:-crunchbase.com}
      CAPSOLVER_API_KEY: ${CAPSOLVER_API_KEY:-}
      PAGELODE_DATABASE_URL: postgres://pagelode:${POSTGRES_PASSWORD:-pagelode}@postgres:5432/pagelode?sslmode=disable
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pagelode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pagelode}
      POSTGRES_DB: pagelode
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagelode -d pagelode"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  browser:
    build:
      context: .
      dockerfile: browser-service/Dockerfile
    environment:
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:?set BROWSER_SERVICE_TOKEN}
      BROWSER_SERVICE_CONCURRENCY: ${BROWSER_SERVICE_CONCURRENCY:-16}
      BROWSER_SERVICE_MAX_SESSIONS: ${BROWSER_SERVICE_MAX_SESSIONS:-4}
      TZ: ${BROWSER_TZ:-Etc/UTC}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - browser-data:/data
    shm_size: 1gb
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  browser-data:
